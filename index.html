<!DOCTYPE html>
<html lang="en"><head><base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epi Bulletin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
:root{
  --navy:#123c73; --sky:#87bbdc; --sky-dark:#6aa3c8; --pale:#dde9f6;
  --red:#c8372d; --green:#2e8b57; --ink:#1f2a3a;
  --muted:#6a7b90; --line:#333333; --bg:#e9eef4; --paper:#ffffff;
  --shadow:0 2px 12px rgba(0,0,0,.14);
  --page-w:210mm;
  --page-h:296mm;
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
  color-adjust:exact !important;
}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{padding:0}

/* ============ Filter bar ============ */
.filters{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
.filters label{font-size:11px;display:flex;flex-direction:column;gap:3px;color:#dbe7f5;
  letter-spacing:.02em;text-transform:uppercase}
.filters select{padding:6px 10px;border-radius:4px;border:0;font-size:12.5px;
  min-width:150px;max-width:220px;background:#fff;color:var(--ink);font-family:inherit}
.filters button{border:0;padding:8px 14px;border-radius:16px;font-weight:700;cursor:pointer;
  font-size:13px;font-family:inherit;transition:transform .08s, box-shadow .12s}
.filters button:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.filters #f-apply  {background:#f2b84b;color:var(--navy)}
.filters #f-reset  {background:#fff;color:var(--navy)}
.filters #f-refresh{background:#7fd0f5;color:var(--navy)}
.filters button:not([id]){background:var(--sky);color:var(--navy)}
.filters .sp{flex:1}
.filters #f-export{background:#7fd0f5;color:var(--navy)}
.xmenu{position:relative}
.xlist{display:none;position:absolute;left:0;top:100%;margin-top:4px;min-width:130px;background:#fff;
  border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:4px;z-index:30}
.xlist.on{display:block}
.filters .xlist button{display:block;width:100%;text-align:left;background:#fff;color:var(--navy);
  border-radius:5px;padding:7px 12px;font-weight:600}
.filters .xlist button:hover{background:var(--pale);transform:none;box-shadow:none}

/* ============ Loading overlay ============ */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(18,60,115,.75);display:none;
  align-items:center;justify-content:center;z-index:100;color:#fff;font:16px Arial}
#loading.on{display:flex}
#loading::before{content:"";display:block;position:absolute;width:52px;height:52px;
  border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Page — fixed box, flex column ============ */
.page{width:var(--page-w);height:var(--page-h);margin:16px auto;background:var(--paper);
  padding:0;position:relative;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;break-inside:avoid;page-break-inside:avoid}

/* ============ Header ============ */
.hd{position:relative;display:flex;align-items:center;gap:14px;background:var(--sky);
  padding:12px 18px;border-bottom:2px solid var(--sky-dark);flex:none}
.hd::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:5%;
  background:#ffffff;
  z-index:0;
  pointer-events:none;
}
.hd > *{position:relative;z-index:1}
.hd img{width:64px;height:64px;border-radius:4px;background:#fff;padding:2px;
  object-fit:contain;box-shadow:0 1px 2px rgba(0,0,0,.13);flex:none}
.hd h1{margin:0;font-size:26px;color:var(--navy);flex:1;line-height:1.15}
.hd small{color:var(--navy);font-weight:700;text-align:right;line-height:1.35}
.hd.sm h1{font-size:22px}

/* ============ Body ============ */
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  padding:18px 76px 10px;overflow:hidden}
.body > *{flex:none}
.body .grow{flex:1 1 var(--b,200px);min-height:var(--m,120px)}

/* ============ KPI tiles ============ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--pale);border-radius:6px;padding:10px 12px;
  position:relative;transition:transform .1s}
.kpi:hover{transform:translateY(-1px)}
.kpi b{font-size:28px;color:var(--navy);display:block;line-height:1.1;margin-top:2px}
.kpi span{color:var(--navy);font-size:13px;display:block;margin-top:2px}
.kpi i{position:absolute;right:10px;top:8px;font-style:normal;font-size:12px;font-weight:700}
.up{color:var(--red)} .dn{color:var(--green)} .fl{color:#777}

/* ============ Typography ============ */
h2{color:var(--navy);font-size:17px;margin:14px 0 6px;line-height:1.25}
.body > h2:first-child{margin-top:0}
h3{color:var(--navy);font-size:13px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.02em}
.txt{font-size:13px;line-height:1.55;text-align:justify}
.body > p.txt{margin:6px 0 0}
.txt b{color:var(--navy)}
.subtitle{font-size:10px;color:var(--muted);text-align:center;margin-top:-4px}
ul.bullets{padding-left:20px;margin:6px 0 0}
ul.bullets li{margin:3px 0;line-height:1.55;font-size:13px;text-align:justify}

/* ============ Layout ============ */
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.row.grow{align-items:stretch;grid-template-rows:minmax(0,1fr)}
.row.grow > *{min-height:0;min-width:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.card{border-left:4px solid var(--sky);background:#f3f8fc;padding:8px 12px;margin:8px 0;
  display:flex;gap:12px;align-items:flex-start;border-radius:4px}
.card img{width:42px;height:42px;object-fit:contain;flex:0 0 42px}
.dis{display:flex;align-items:center;gap:10px;margin-top:0}
.dis img{width:40px;height:40px;object-fit:contain}
.dis h2{margin:0;font-size:20px}

.blk{flex:1 1 auto;display:flex;flex-direction:column}
.blk + .blk{margin-top:14px}
.blk .row.grow{margin-top:6px}
.blk > p.txt{margin:6px 0 0}

/* ============ Charts ============ */
.ch{position:relative;min-height:0;min-width:0}
.col > .ch{flex:1 1 0}
.ch canvas{position:absolute !important;top:0;left:0}

/* ============ Maps ============ */
.map-wrap{position:relative;width:100%;flex:1 1 0;min-height:0;margin:6px 0 4px}
.map-wrap svg{display:block;position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.legend-row{flex:none}

/* ============ Tables ============ */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--sky);color:var(--navy);padding:7px;border:1px solid var(--line);font-weight:700}
td{padding:6px;border:1px solid var(--line);text-align:center}
tr.sub td{background:var(--pale);font-weight:700}

/* ============ Footer ============ */
.foot{flex:none;text-align:center;font-size:10px;color:#889;line-height:1.35;
  padding:6px 16px 8px}

/* ============ Legend ============ */
.legend-row{display:flex;gap:12px;font-size:11px;flex-wrap:wrap;margin:6px 0 0;align-items:center}
.legend-row span{display:flex;align-items:center;gap:4px}
.legend-row img{width:18px;height:18px;object-fit:contain}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%}

/* ============ Contributors ============ */
.contrib{display:flex;gap:20px;margin-top:12px}
.contrib ul{padding-left:18px;margin:4px 0;font-size:13px;line-height:1.65}

/* ============ CTA row ============ */
.cta{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;text-align:center}
.cta .b{background:#e7f0f8;border-radius:8px;padding:20px 12px}
.cta .b h3{margin:6px 0 8px;font-size:14px}
.cta .b .btn{background:#fff;color:#2b7a9e;border:1px solid #cfe4f2;border-radius:16px;
  padding:6px 18px;font-weight:700;text-decoration:none;display:inline-block;font-size:13px;
  transition:background .12s}
.cta .b .btn:hover{background:#f3faff}

/* ============ Error overlay ============ */
#err{display:none;position:fixed;left:0;right:0;bottom:0;background:#fee;color:#900;
  padding:10px;font:13px/1.4 monospace;z-index:99;white-space:pre-wrap;
  max-height:40vh;overflow:auto;box-shadow:0 -2px 10px rgba(0,0,0,.15)}

/* ============ Landscape layout ============ */
body.landscape{--page-w:1280px;--page-h:719px}
.landscape .body{padding:12px 44px 6px}
.landscape .hd{padding:8px 18px}
.landscape h2{margin:10px 0 4px}
.landscape .cta{margin-top:24px}
.l1{display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:minmax(0,1.15fr) auto minmax(0,1fr);column-gap:24px;margin-top:8px}
.l1 > *{min-height:0;min-width:0}
.l1 > h2{grid-column:1 / -1;margin:8px 0 4px}
.l2{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:minmax(0,1fr);gap:24px}
.l2 > *{min-height:0;min-width:0}
.l2 .card:first-child{margin-top:0}
.landscape .card{margin:6px 0;padding:6px 12px}
.landscape .foot{padding:4px 16px 6px}
.l3{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:24px}
.l3 > .blk{min-height:0;min-width:0}
.l3 > .blk + .blk{margin-top:0}
.l3 .row.grow{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}

/* ============ Print ============ */
@media print{
  html,body{background:#fff;margin:0;padding:0;height:auto}
  #app{padding:0;margin:0}
  .page{margin:0;box-shadow:none;break-after:auto;page-break-after:auto;
    break-inside:avoid;page-break-inside:avoid}
  .page + .page{break-before:page;page-break-before:always}
  .filters,#loading,#err{display:none !important}
  #app{zoom:1 !important}
}
@page{size:A4 portrait;margin:0}
</style>

<script>
'use strict';

const PAGE_COUNT = 6;

const showErr = m => {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent += m + '\n';
  console.error(m);
};
window.onerror = (m,u,l) => showErr('JS error: ' + m + ' (line ' + l + ')');
if (typeof Chart === 'undefined')
  showErr('Chart.js did not load (CDN blocked?) – tables render, charts do not.');

let LAYOUT = 'portrait', ORIENT = 'portrait';
try { const o = localStorage.getItem('epi_layout'); if (o === 'landscape' || o === 'portrait' || o === 'fullscreen') LAYOUT = o; } catch (e) {}
function applyOrientation_() {
  ORIENT = LAYOUT === 'portrait' ? 'portrait' : 'landscape';
  document.body.classList.toggle('landscape', ORIENT === 'landscape');
  let st = document.getElementById('page-size');
  if (!st) { st = document.createElement('style'); st.id = 'page-size'; document.head.appendChild(st); }
  st.textContent = ORIENT === 'landscape' ? '@page{size:1280px 720px;margin:0}' : '@page{size:A4 portrait;margin:0}';
  const sel = document.getElementById('f-orient'); if (sel) sel.value = LAYOUT;
}
function applyFit_() {
  const app = document.getElementById('app'); if (!app) return;
  app.style.zoom = '';
  if (LAYOUT !== 'fullscreen') return;
  const pg = app.querySelector('.page'); if (!pg) return;
  const k = Math.min(3, Math.max(0.4, (document.documentElement.clientWidth - 32) / pg.offsetWidth));
  app.style.zoom = String(k);
  resizeCharts();
}
function setOrientation(v) {
  LAYOUT = (v === 'landscape' || v === 'fullscreen') ? v : 'portrait';
  try { localStorage.setItem('epi_layout', LAYOUT); } catch (e) {}
  try {
    if (LAYOUT === 'fullscreen' && !document.fullscreenElement && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(() => {});
    else if (LAYOUT !== 'fullscreen' && document.fullscreenElement && document.exitFullscreen)
      document.exitFullscreen().catch(() => {});
  } catch (e) {}
  applyOrientation_();
  if (D && D.meta) { try { render(); } catch (e) { showErr('Render: ' + e.message); } }
}
window.addEventListener('resize', () => { if (LAYOUT === 'fullscreen') applyFit_(); });
applyOrientation_();

/* ================= API CLIENT (GitHub Pages -> Apps Script) ================= */
let D = null;
const API_URL = 'https://script.google.com/macros/s/AKfycbzU3FOnIGWIbIpQavnfJY6S10QfuHpCGFob_4IfJXDawjA_tnIOD4mahAAGi13LIiYN/exec';
const API_TOKEN = 'xcvpddanieldamtew091101getahunhilu';   // same value as the API_TOKEN script property, or leave empty
function callApi(year, week, sub, wor, refresh, assets) {
  const q = new URLSearchParams({ api: 1, year: year || 0, week: week || 0,
    subcity: sub || '', woreda: wor || '', refresh: refresh ? 1 : 0,
    assets: assets ? 1 : 0, token: API_TOKEN });
  return fetch(API_URL + '?' + q.toString()).then(r => r.json());
}

const CHARTS = [];
const NAVY = '#123c73';
const YEAR_COLORS = {
  0: '#0D3D7A', 1: '#2E9F4B', 2: '#E3B505', 3: '#8C8C8C', 4: '#C3423F'
};
const DCOL = {
  chemical_poisoning:'#a855f7', measles:'#dc2626', perinatal_death:'#f97316',
  afp_polio:'#eab308', rabies_exposure:'#14b8a6', human_rabies:'#2563eb',
  relapsing_fever:'#9333ea'
};

const esc  = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm   = s => String(s).replace(/_/g,' ').toUpperCase();
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const findD = k => (D.weekly||[]).concat(D.immediate||[]).find(d => d.key === k)
  || { total:0, fac:[], sub:[], wor:[], deaths:[], trend:{} };

const MAP_W = 400, MAP_PAD = 0.02, MAP_PCT = 0.01;

function collectCoords(features) {
  const lons = [], lats = [];
  const walk = c => {
    if (typeof c[0] === 'number') { lons.push(c[0]); lats.push(c[1]); }
    else c.forEach(walk);
  };
  features.forEach(f => walk(f.geometry.coordinates));
  return { lons, lats };
}
function percentile(sortedArr, q) {
  if (!sortedArr.length) return 0;
  const i = Math.min(sortedArr.length - 1, Math.max(0, Math.floor(sortedArr.length * q)));
  return sortedArr[i];
}
function robustBbox(features) {
  const { lons, lats } = collectCoords(features);
  if (!lons.length) return null;
  const ls = lons.slice().sort((a,b)=>a-b);
  const ts = lats.slice().sort((a,b)=>a-b);
  let x0 = percentile(ls, MAP_PCT), x1 = percentile(ls, 1 - MAP_PCT);
  let y0 = percentile(ts, MAP_PCT), y1 = percentile(ts, 1 - MAP_PCT);
  if (x1 - x0 < 1e-6) { x0 = ls[0]; x1 = ls[ls.length - 1]; }
  if (y1 - y0 < 1e-6) { y0 = ts[0]; y1 = ts[ts.length - 1]; }
  const dx = (x1 - x0) * MAP_PAD, dy = (y1 - y0) * MAP_PAD;
  return { x0: x0 - dx, x1: x1 + dx, y0: y0 - dy, y1: y1 + dy };
}
function projector(features, W) {
  const bb = robustBbox(features);
  if (!bb) return null;
  const lonRange = bb.x1 - bb.x0;
  const latRange = bb.y1 - bb.y0;
  if (lonRange <= 0 || latRange <= 0) return null;
  const midLat = (bb.y0 + bb.y1) / 2;
  const cosLat = Math.cos(midLat * Math.PI / 180) || 1;
  const H = W * latRange / (lonRange * cosLat);
  const P = ([lon, lat]) => [
    (lon - bb.x0) / lonRange * W,
    (bb.y1 - lat) / latRange * H
  ];
  return { W, H, P };
}
function ringsOf(f) {
  return f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
}
function pathOf(f, P) {
  const oneRing = ring => {
    if (!ring || !ring.length) return '';
    return 'M' + ring.map(p => {
      const xy = P(p);
      return xy[0].toFixed(1) + ',' + xy[1].toFixed(1);
    }).join('L') + 'Z';
  };
  return ringsOf(f).map(poly => poly.map(oneRing).join('')).join('');
}
function centroidOf(f, P) {
  const polys = ringsOf(f);
  let best = null, bestLen = 0;
  polys.forEach(poly => {
    const r = poly[0];
    if (r && r.length > bestLen) { best = r; bestLen = r.length; }
  });
  if (!best || !best.length) return null;
  let sx = 0, sy = 0, n = 0;
  for (let i = 0; i < best.length; i++) {
    if (i === best.length - 1 && best.length > 1 &&
        best[i][0] === best[0][0] && best[i][1] === best[0][1]) break;
    const xy = P(best[i]);
    sx += xy[0]; sy += xy[1]; n++;
  }
  return n ? [sx/n, sy/n] : null;
}

function logGeoReport() {
  try {
    const r = D && D.geoMap && D.geoMap.report;
    if (!r) return;
    (r.warn || []).forEach(w => console.warn('[geo] ' + w));
  } catch (e) {}
}

function joinList(arr) {
  if (arr.length === 0) return '';
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return arr[0] + ' and ' + arr[1];
  return arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];
}
function richNarrative(d, extraTxt, M) {
  const total = d.total || 0;
  if (!total) {
    let s = `No cases of <b>${esc(d.label.toLowerCase())}</b> were reported in Week ${M.week} of ${M.year}.`;
    if (extraTxt) s += ' ' + extraTxt;
    if (d.narrative) s += ' ' + d.narrative;
    return s;
  }
  const sentences = [];
  sentences.push(`A total of <b>${total.toLocaleString()}</b> case${total === 1 ? '' : 's'} of <b>${esc(d.label.toLowerCase())}</b> ${total === 1 ? 'was' : 'were'} reported during Week ${M.week} of ${M.year}.`);
  if (d.sub && d.sub.length) {
    const n = Math.min(3, d.sub.length);
    const listed = d.sub.slice(0, n).map(x =>
      `<b>${esc(x[0])}</b> (${x[1].toLocaleString()} case${x[1] === 1 ? '' : 's'}, ${Math.round(x[1]/total*100)}%)`);
    sentences.push(`The burden was concentrated in ${joinList(listed)}` + (d.sub.length > n ? ', among other sub-cities.' : '.'));
  }
  const ty = (d.trend && d.trend[M.year]) || [];
  const ly = (d.trend && d.trend[M.year - 1]) || [];
  const prevWk = ly[M.week - 1];
  if (prevWk != null && prevWk > 0) {
    const diff = total - prevWk;
    if (diff > 0) {
      const pct = Math.round(diff / prevWk * 100);
      sentences.push(`Compared with the same epidemiological week in ${M.year - 1} (${prevWk.toLocaleString()} case${prevWk === 1 ? '' : 's'}), this is an increase of <b>${diff.toLocaleString()}</b> case${diff === 1 ? '' : 's'} (<b>+${pct}%</b>).`);
    } else if (diff < 0) {
      const pct = Math.round(Math.abs(diff) / prevWk * 100);
      sentences.push(`Compared with the same epidemiological week in ${M.year - 1} (${prevWk.toLocaleString()} case${prevWk === 1 ? '' : 's'}), this is a decrease of <b>${Math.abs(diff).toLocaleString()}</b> case${Math.abs(diff) === 1 ? '' : 's'} (<b>−${pct}%</b>).`);
    } else {
      sentences.push(`The weekly total is unchanged from the same epidemiological week in ${M.year - 1} (${prevWk.toLocaleString()} case${prevWk === 1 ? '' : 's'}).`);
    }
  } else if (prevWk === 0) {
    sentences.push(`No cases were recorded during the same epidemiological week in ${M.year - 1}.`);
  }
  if (ty.length && ly.length) {
    let ytdCur = 0, ytdPrev = 0;
    for (let i = 0; i < M.week; i++) {
      if (ty[i] != null) ytdCur += ty[i];
      if (ly[i] != null) ytdPrev += ly[i];
    }
    if (ytdPrev > 0) {
      const pct = Math.round((ytdCur - ytdPrev) / ytdPrev * 100);
      const word = pct >= 0 ? 'higher' : 'lower';
      sentences.push(`Cumulatively, <b>${ytdCur.toLocaleString()}</b> case${ytdCur === 1 ? '' : 's'} have been reported between Week 1 and Week ${M.week} — ${Math.abs(pct)}% ${word} than the ${ytdPrev.toLocaleString()} case${ytdPrev === 1 ? '' : 's'} recorded during the same period in ${M.year - 1}.`);
    } else if (ytdCur > 0) {
      sentences.push(`Cumulatively, <b>${ytdCur.toLocaleString()}</b> case${ytdCur === 1 ? '' : 's'} have been reported between Week 1 and Week ${M.week}; no comparable figure exists for ${M.year - 1}.`);
    }
  }
  if (d.fac && d.fac.length > 1) {
    const topF = d.fac.slice(0, 3).map(x => `<b>${esc(x[0])}</b> (${x[1].toLocaleString()})`).join(', ');
    sentences.push(`The facilities contributing the largest share were ${topF}.`);
  }
  if (d.deaths && d.deaths.length) {
    const dTotal = d.deaths.reduce((a, x) => a + (x[1] || 0), 0);
    if (dTotal > 0) {
      const dStr = d.deaths.map(x => `${esc(x[0])} (${x[1]})`).join(', ');
      sentences.push(`<b>${dTotal}</b> death${dTotal === 1 ? '' : 's'} were recorded this week at ${dStr}.`);
    }
  }
  if (extraTxt) sentences.push(extraTxt);
  if (d.narrative) sentences.push(d.narrative);
  return sentences.join(' ');
}
function immediateNarrative(d, M) {
  if (!d.total) return 'No cases were reported in the current week.';
  const parts = [];
  parts.push(`Surveillance identified <b>${d.total}</b> case${d.total === 1 ? '' : 's'} this week${d.fac.length ? ` across ${d.fac.length} reporting site${d.fac.length === 1 ? '' : 's'}` : ''}.`);
  if (d.fac.length > 1) {
    const top = d.fac.slice(0, 3).map(x => `<b>${esc(x[0])}</b> (${x[1]})`).join(', ');
    parts.push(`The largest contributors were ${top}.`);
  }
  if (d.sub.length) {
    const sub = d.sub.slice(0, 3).map(x => `<b>${esc(x[0])}</b> (${x[1]})`).join(', ');
    parts.push(`By sub-city, the highest counts were recorded in ${sub}.`);
  }
  return parts.join(' ');
}

function fitPages() {
  applyFit_();
  const eb = document.getElementById('err');
  if (eb) {
    const keep = eb.textContent.split('\n').filter(l => l && l.indexOf('Layout:') !== 0);
    eb.textContent = keep.length ? keep.join('\n') + '\n' : '';
    if (!keep.length) eb.style.display = 'none';
  }
  const pages = Array.from(document.querySelectorAll('#app .page'));
  if (pages.length !== PAGE_COUNT)
    showErr('Layout: expected ' + PAGE_COUNT + ' pages, found ' + pages.length + '.');
  const MIN_PX = 10;
  pages.forEach((p, i) => {
    const b = p.querySelector('.body'); if (!b) return;
    let over = b.scrollHeight - b.clientHeight;
    if (over > 1) {
      const els = Array.from(b.querySelectorAll('.txt, ul.bullets li'))
        .filter(e => !e.closest('.lg') && !e.closest('.ph'));
      els.forEach(e => { e.dataset.fs0 = parseFloat(getComputedStyle(e).fontSize); });
      for (let f = 0.99; f >= 0.6 && over > 1; f -= 0.01) {
        els.forEach(e => {
          const fs0 = +e.dataset.fs0;
          e.style.fontSize = Math.min(fs0, Math.max(MIN_PX, fs0 * f)).toFixed(2) + 'px';
        });
        over = b.scrollHeight - b.clientHeight;
      }
      if (over <= 1) console.info('[layout] page ' + (i + 1) + ': narration text reduced to fit.');
    }
    if (over > 1)
      showErr('Layout: page ' + (i + 1) + ' content exceeds the page by ' + over +
              'px even with narration text at its minimum size (' + MIN_PX + ' px).');
  });
}

    const g  = D.geo && D.geo.wor;

    if (!g || !g.features || !g.features.length)
      return '<p class="txt">Woreda map not configured.</p>';
    if (!Object.keys(gm).length)
      return '<p class="txt">Woreda GeoJSON could not be matched. Run diagnoseGeo() in the editor.</p>';

    const proj = projector(g.features, MAP_W);
    if (!proj) return '<p class="txt">Could not compute map bounds.</p>';
    const { W, H, P } = proj;

    const worOfSub = {};
    g.features.forEach((f, i) => {
      const s = f.properties.s;
      if (s) (worOfSub[s] = worOfSub[s] || []).push(i);
    });

    const hotByIdx = new Map();
    (D.outbreaks || []).forEach(o => {
      let idxs = gm[o.wor] || [];
      if (!idxs.length && o.sub) idxs = worOfSub[o.sub] || [];
      if (!idxs.length) return;
      idxs.forEach(i => {
        if (!hotByIdx.has(i)) hotByIdx.set(i, {});
        const row = hotByIdx.get(i);
        row[o.d] = (row[o.d] || 0) + (o.v || 0);
      });
    });

    const shapes = g.features.map(f =>
      `<path d="${pathOf(f, P)}" fill="#ffffff" stroke="#8a9aaa"
             stroke-width="0.6" stroke-linejoin="round"/>`
    ).join('');

    const ICON = 14, ROW_H = 20, ROW_W = 58, ROW_GAP = 2, markers = [];

    g.features.forEach((f, i) => {
      const diseases = hotByIdx.get(i);
      if (!diseases) return;
      const c = centroidOf(f, P);
      if (!c) return;

      const list = Object.keys(diseases);
      const totalH = list.length * ROW_H + (list.length - 1) * ROW_GAP;
      const startY = c[1] - totalH / 2;
      const startX = c[0] - ROW_W / 2;

      list.forEach((dk, j) => {
        const color = DCOL[dk] || NAVY;
        const icon  = ICONS[dk] || '';
        const count = diseases[dk];
        const y = startY + j * (ROW_H + ROW_GAP);
        const x = startX;

        markers.push(
          `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ROW_W}" height="${ROW_H}"
                 rx="3" ry="3" fill="#ffffff" fill-opacity="0.97"
                 stroke="${color}" stroke-width="1.5"/>`);
        markers.push(
          `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="3" height="${ROW_H}"
                 rx="1" ry="1" fill="${color}"/>`);
        if (icon) {
          markers.push(
            `<image xmlns:xlink="http://www.w3.org/1999/xlink"
                    xlink:href="${icon}" href="${icon}"
                    x="${(x + 4).toFixed(1)}" y="${(y + 3).toFixed(1)}"
                    width="${ICON}" height="${ICON}"
                    preserveAspectRatio="xMidYMid meet"/>`);
        } else {
          const letter = String(dk).charAt(0).toUpperCase();
          markers.push(
            `<text x="${(x + 4 + ICON/2).toFixed(1)}" y="${(y + ROW_H/2 + 4).toFixed(1)}"
                   text-anchor="middle" font-size="10" font-weight="700"
                   fill="${color}" font-family="Arial">${esc(letter)}</text>`);
        }
        markers.push(
          `<text x="${(x + ROW_W - 4).toFixed(1)}" y="${(y + ROW_H/2 + 4).toFixed(1)}"
                 text-anchor="end" font-size="11" font-weight="700"
                 fill="${NAVY}" font-family="Arial">${count}</text>`);
      });
    });

    const PAD = 34;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg"
                      xmlns:xlink="http://www.w3.org/1999/xlink"
                      viewBox="${-PAD} ${-PAD} ${(W + 2*PAD).toFixed(0)} ${(H + 2*PAD).toFixed(0)}"
                      preserveAspectRatio="xMidYMid meet">
                   ${shapes}${markers.join('')}
                 </svg>`;
    return `<div class="map-wrap">${svg}</div>`;
  }

  function mapImmediateSvg() {
    const g  = D.geo && D.geo.wor;
    const gm = (D.geoMap && D.geoMap.wor) || {};
    if (!g || !g.features || !g.features.length) return '';
    if (!Object.keys(gm).length)
      return '<p class="txt">Woreda GeoJSON could not be matched to the data.</p>';

    const proj = projector(g.features, MAP_W);
    if (!proj) return '<p class="txt">Could not compute map bounds.</p>';
    const { W, H, P } = proj;

    const shapes = g.features.map(f =>

function populateFilters() {
  const o = D.options; if (!o) return;
  const fill = (id, items, val) => {
    const el = document.getElementById(id); if (!el) return;
    el.innerHTML = items.map(x =>
      `<option value="${esc(x.v)}"${String(x.v)===String(val)?' selected':''}>${esc(x.t)}</option>`
    ).join('');
  };
  fill('f-year', o.years.map(y=>({v:y,t:y})), o.year);
  fill('f-week', o.weeks.map(w=>({v:w,t:'Week '+w})), o.week);
  fill('f-sub',  [{v:'',t:'All Sub-Cities'}].concat(o.subcities.map(s=>({v:s,t:s}))), o.filter.subcity);
  updateWoredas(o.filter.woreda);
}
function updateWoredas(selected) {
  const o = D.options; if (!o) return;
  const sub = document.getElementById('f-sub').value;
  let list = o.woredas || [];
  if (sub) list = list.filter(w => norm(o.worToSub[w]||'') === norm(sub));
  const el = document.getElementById('f-wor');
  const cur = selected !== undefined ? selected : el.value;
  el.innerHTML = [{v:'',t:'All Woredas'}].concat(list.map(w=>({v:w,t:w})))
    .map(x => `<option value="${esc(x.v)}"${x.v===cur?' selected':''}>${esc(x.t)}</option>`).join('');
}
function onYearChange() {
  const year = +document.getElementById('f-year').value;
  callApi(year, 0, '', '', false, false).then(res => {
    if (!res || !res.ok) { showErr('Year load failed: ' + (res && res.error || 'unknown')); return; }
    D.options = res.data.options;
    if (!D.icons) D.icons = res.data.icons;
    if (!D.geo || !D.geo.sub) D.geo = res.data.geo;
    if (res.data.geoMap) D.geoMap = res.data.geoMap;
    populateFilters();
  }).catch(e => showErr('Year load failed: ' + e.message));
}
function applyFilters(refresh) {
  const year = +document.getElementById('f-year').value;
  const week = +document.getElementById('f-week').value;
  const subcity = document.getElementById('f-sub').value;
  const woreda = document.getElementById('f-wor').value;
  const ld = document.getElementById('loading'); ld.classList.add('on');
  callApi(year, week, subcity, woreda, !!refresh, false)
    .then(res => {
      ld.classList.remove('on');
      if (!res || !res.ok) { showErr('Server: ' + (res && res.error || 'unknown')); return; }
      const nd = res.data;
      if (!nd.logo) nd.logo = D.logo;
      if (!nd.icons) nd.icons = D.icons;
      if (!nd.geo || !nd.geo.sub) nd.geo = D.geo;
      if (!nd.geoMap) nd.geoMap = D.geoMap;
      D = nd;
      try { render(); } catch (e) { showErr('Render: ' + e.message); }
      populateFilters();
    })
    .catch(err => { ld.classList.remove('on'); showErr('Call failed: ' + err.message); });
}
function resetFilters() {
  const o = D.options;
  document.getElementById('f-sub').value = '';
  document.getElementById('f-year').value = o.years[o.years.length - 1];
  document.getElementById('f-week').value = o.weeks[o.weeks.length - 1];

/* ==================================================================

const EXP = {
  rgbHex(c) {
    const m = String(c).match(/rgba?\(([^)]+)\)/); if (!m) return '000000';
    return m[1].split(',').slice(0, 3).map(v => Math.round(parseFloat(v)).toString(16).padStart(2, '0')).join('').toUpperCase();
  },
  transp(c) {
    const m = String(c).match(/rgba?\(([^)]+)\)/); if (!m) return true;
    const p = m[1].split(',').map(parseFloat); return p.length > 3 && p[3] === 0;
  },
  hex(c) { return String(c || '000000').replace('#', '').toUpperCase().slice(0, 6); },
  R(ctx, el) {
    const b = el.getBoundingClientRect ? el.getBoundingClientRect() : el;
    return { x: (b.left - ctx.pr.left) * ctx.s, y: (b.top - ctx.pr.top) * ctx.s, w: b.width * ctx.s, h: b.height * ctx.s };
  },
  lineH(cs) { const l = parseFloat(cs.lineHeight); return isNaN(l) ? parseFloat(cs.fontSize) * 1.2 : l; },
  align(cs) {
    const a = cs.textAlign;
    return a === 'center' ? 'center' : (a === 'right' || a === 'end') ? 'right' : a === 'justify' ? 'justify' : 'left';
  },
  INLINE: new Set(['B', 'STRONG', 'I', 'EM', 'BR', 'SPAN', 'A', 'U', 'SMALL']),
  inlineOnly(el) { return Array.from(el.querySelectorAll('*')).every(n => EXP.INLINE.has(n.tagName)); },

  runsOf(el) {
    const runs = []; let afterBreak = true;
    const walk = n => {
      if (n.nodeType === 3) {
        let t = n.nodeValue.replace(/\s+/g, ' ');
        if (afterBreak) t = t.replace(/^\s+/, '');
        if (!t) return;
        const cs = getComputedStyle(n.parentElement);
        if (cs.textTransform === 'uppercase') t = t.toUpperCase();
        runs.push({ text: t, options: { bold: parseInt(cs.fontWeight, 10) >= 600, italic: cs.fontStyle === 'italic',
          color: EXP.rgbHex(cs.color), fontSize: Math.round(parseFloat(cs.fontSize) * 75) / 100 } });
        afterBreak = false;
      } else if (n.nodeType === 1) {
        if (n.tagName === 'BR') { if (runs.length) runs[runs.length - 1].options.breakLine = true; afterBreak = true; return; }
        n.childNodes.forEach(walk);
      }
    };
    el.childNodes.forEach(walk);
    if (runs.length) {
      const l = runs[runs.length - 1]; l.text = l.text.replace(/\s+$/, ''); delete l.options.breakLine;
    }
    return runs.filter(r => r.text !== '');
  },

  text(ctx, el, runs) {
    runs = runs || EXP.runsOf(el); if (!runs.length) return;
    const cs = getComputedStyle(el), r = EXP.R(ctx, el);
    if (r.w <= 0 || r.h <= 0) return;
    const lh = EXP.lineH(cs), single = (r.h / ctx.s) < lh * 1.6, al = EXP.align(cs), slack = 0.12;
    let x = r.x, w = r.w;
    if (single) { w += slack; if (al === 'right') x -= slack; else if (al === 'center') x -= slack / 2; }
    const o = { x, y: r.y, w, h: r.h, fontFace: 'Arial', fontSize: Math.round(parseFloat(cs.fontSize) * 75) / 100,
      align: al, valign: single ? 'middle' : 'top', margin: 0, wrap: true };
    if (!single) o.lineSpacing = Math.round(lh * 75) / 100;
    ctx.slide.addText(runs, o);
  },

  box(ctx, el) {
    const cs = getComputedStyle(el), r = EXP.R(ctx, el);
    if (r.w <= 0 || r.h <= 0) return;
    const hasBg = !EXP.transp(cs.backgroundColor);
    const bt = parseFloat(cs.borderTopWidth) || 0, bl = parseFloat(cs.borderLeftWidth) || 0;
    const rad = parseFloat(cs.borderTopLeftRadius) || 0;
    if (hasBg || bt > 0) {
      const o = { x: r.x, y: r.y, w: r.w, h: r.h };
      if (hasBg) o.fill = { color: EXP.rgbHex(cs.backgroundColor) };
      o.line = bt > 0 ? { color: EXP.rgbHex(cs.borderTopColor), width: bt * 0.75 } : { type: 'none' };
      if (rad > 0) { o.rectRadius = Math.min(rad * ctx.s, r.h / 2, r.w / 2); ctx.slide.addShape(ctx.pptx.shapes.ROUNDED_RECTANGLE, o); }
      else ctx.slide.addShape(ctx.pptx.shapes.RECTANGLE, o);
    }
    if (bl > 0 && bt === 0)
      ctx.slide.addShape(ctx.pptx.shapes.RECTANGLE, { x: r.x, y: r.y, w: bl * ctx.s, h: r.h,
        fill: { color: EXP.rgbHex(cs.borderLeftColor) }, line: { type: 'none' } });

  image(ctx, img) {

        line: { type: 'none' }, rectRadius: Math.min(4 * ctx.s, b.width * ctx.s / 2) });
    const pad = parseFloat(cs.paddingLeft) || 0;
    const w = b.width - 2 * pad, h = b.height - 2 * pad;
    let nw = img.naturalWidth || w, nh = img.naturalHeight || h;
    const k = Math.min(w / nw, h / nh), dw = nw * k, dh = nh * k;
    const x = b.left + pad + (w - dw) / 2, y = b.top + pad + (h - dh) / 2;
    ctx.slide.addImage({ data: img.src, x: (x - ctx.pr.left) * ctx.s, y: (y - ctx.pr.top) * ctx.s, w: dw * ctx.s, h: dh * ctx.s });
  },

  inline(ctx, el) {
    const walk = n => {
      if (n.nodeType === 3) {
        const t = n.nodeValue.replace(/\s+/g, ' ').trim(); if (!t) return;
        const pe = n.parentElement, cs = getComputedStyle(pe);
        const rg = document.createRange(); rg.selectNodeContents(n);
        const b = rg.getBoundingClientRect(); if (!b.width) return;
        const r = EXP.R(ctx, b);
        ctx.slide.addText([{ text: t, options: { bold: parseInt(cs.fontWeight, 10) >= 600, color: EXP.rgbHex(cs.color) } }],
          { x: r.x, y: r.y, w: r.w + 0.12, h: r.h, fontFace: 'Arial', fontSize: Math.round(parseFloat(cs.fontSize) * 75) / 100,
            align: 'left', valign: 'middle', margin: 0, wrap: true });

        if (n.tagName === 'IMG') { EXP.image(ctx, n); return; }
        const cs = getComputedStyle(n);
        if (cs.display === 'inline-block' && !EXP.transp(cs.backgroundColor) && n.children.length === 0 && !n.textContent.trim()) {
          ctx.slide.addShape(ctx.pptx.shapes.OVAL, { ...EXP.R(ctx, n), fill: { color: EXP.rgbHex(cs.backgroundColor) }, line: { type: 'none' } });

        w: (lr.right - ur.left) * ctx.s, h: lr.height * ctx.s, fontFace: 'Arial',
        fontSize: Math.round(parseFloat(cs.fontSize) * 75) / 100, align: EXP.align(cs), valign: 'top', margin: 0, wrap: true,
        lineSpacing: Math.round(EXP.lineH(cs) * 75) / 100, bullet: { indent: Math.max(8, Math.round(pad * 75) / 100) } });
    });

  table(ctx, tbl) {

        border: { type: 'solid', pt: 0.75, color: '333333' }, margin: [3, 4, 3, 4] };
      if (!EXP.transp(cs.backgroundColor)) o.fill = { color: EXP.rgbHex(cs.backgroundColor) };

    }));

    const num = v => (v == null || isNaN(+v)) ? 0 : +v;
    const base = { x: r.x, y: r.y, w: r.w, h: r.h, showTitle: !!title, title, titleFontSize: 9, titleColor: '123C73',
      titleFontFace: 'Arial', catAxisLabelFontFace: 'Arial', valAxisLabelFontFace: 'Arial', legendFontFace: 'Arial',
      valAxisLabelFontSize: 7, catAxisLabelFontSize: 6, legendFontSize: 7,
      valGridLine: { color: 'E5E5E5', size: 0.5 }, catGridLine: { style: 'none' } };
    const axT = (a, key, sz) => (a && a.title && a.title.text) ? { ['show' + key + 'AxisTitle']: true, [key.toLowerCase() + 'AxisTitle']: a.title.text,
      [key.toLowerCase() + 'AxisTitleFontSize']: sz || 7, [key.toLowerCase() + 'AxisTitleFontFace']: 'Arial' } : {};

      { type: ctx.pptx.charts.LINE, data: line, options: { chartColors: ['49CD28'], lineSize: 2, lineDataSymbol: 'none' } }
    ], { ...base, valAxisMaxVal: 100, valAxisMinVal: 0, valAxisMajorUnit: 20, showLegend: true, legendPos: 't',
      catAxisLabelRotate: 315, ...axT(sc.y, 'Val', 7), ...axT(sc.x, 'Cat', 7) });
  },

  header(ctx, hd) {
    const cs = getComputedStyle(hd), r = EXP.R(ctx, hd);
    const bw = parseFloat(cs.borderBottomWidth) || 0;
    ctx.slide.addShape(ctx.pptx.shapes.RECTANGLE, { x: r.x, y: r.y, w: r.w, h: r.h, fill: { color: EXP.rgbHex(cs.backgroundColor) }, line: { type: 'none' } });
    ctx.slide.addShape(ctx.pptx.shapes.RECTANGLE, { x: r.x, y: r.y, w: r.w * 0.05, h: r.h - bw * ctx.s, fill: { color: 'FFFFFF' }, line: { type: 'none' } });
    if (bw) ctx.slide.addShape(ctx.pptx.shapes.RECTANGLE, { x: r.x, y: r.y + r.h - bw * ctx.s, w: r.w, h: bw * ctx.s,
      fill: { color: EXP.rgbHex(cs.borderBottomColor) }, line: { type: 'none' } });
    Array.from(hd.children).forEach(c => EXP.emit(ctx, c));
  },

  emit(ctx, el) {
    try {
      const tag = el.tagName;
      if (tag === 'CANVAS' || tag === 'STYLE' || tag === 'SCRIPT') return;
      const r = el.getBoundingClientRect(); if (r.width <= 0 && r.height <= 0) return;
      if (el.matches('.hd')) return EXP.header(ctx, el);
      if (tag === 'TABLE') return EXP.table(ctx, el);
      if (tag === 'UL') return EXP.list(ctx, el);
      if (tag === 'IMG') return EXP.image(ctx, el);
      if (el.matches('.map-wrap')) {
        const svg = el.querySelector('svg'), png = svg && ctx.maps.get(svg);
        if (png) ctx.slide.addImage({ data: png, ...EXP.R(ctx, el) });
        else Array.from(el.children).forEach(c => EXP.emit(ctx, c));
        return;
      }
      if (el.matches('.ch')) {
        const cv = el.querySelector('canvas'), ch = cv && ctx.charts.get(cv);
        if (ch) EXP.chart(ctx, el, ch);
        return;
      }
      if (el.matches('.legend-row, .lg')) return EXP.inline(ctx, el);
      if (tag === 'A') {
        EXP.box(ctx, el);
        const runs = EXP.runsOf(el), href = el.getAttribute('href') || '';
        if (/^https?:/i.test(href)) runs.forEach(x => x.options.hyperlink = { url: href });
        const cs = getComputedStyle(el), rr = EXP.R(ctx, el);
        if (runs.length) ctx.slide.addText(runs, { x: rr.x, y: rr.y, w: rr.w, h: rr.h, fontFace: 'Arial',
          fontSize: Math.round(parseFloat(cs.fontSize) * 75) / 100, align: 'center', valign: 'middle', margin: 0 });
        return;
      }
      if (el.matches('.kpi, .card, .b, .ph')) {
        EXP.box(ctx, el);
        Array.from(el.children).forEach(c => EXP.emit(ctx, c));
        return;
      }
      if (EXP.inlineOnly(el)) return EXP.text(ctx, el);
      Array.from(el.children).forEach(c => EXP.emit(ctx, c));
    } catch (e) { showErr('PPT element skipped: ' + e.message); }
  },

  svgToPng(svg, w, h) {
    const k = Math.min(3, 2400 / Math.max(w, h));
    const c = svg.cloneNode(true);
    c.setAttribute('width', Math.round(w * k)); c.setAttribute('height', Math.round(h * k)); c.removeAttribute('style');
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/png'));
      };
      img.onerror = () => rej(new Error('Map could not be rendered for PPT'));
      img.src = url;
    });
  }
};

async function exportPPT() {
  try {
    if (typeof PptxGenJS === 'undefined') { alert('PPT library failed to load.'); return; }
    const M = D.meta;
    const pages = Array.from(document.querySelectorAll('#app .page'));
    if (pages.length !== PAGE_COUNT) {
      showErr('PPT: expected ' + PAGE_COUNT + ' pages, found ' + pages.length + '. Export aborted.');
      return;
    }
    const LND = ORIENT === 'landscape';
    const SLIDE_W = LND ? 13.333 : 210 / 25.4, SLIDE_H = LND ? 7.5 : 297 / 25.4;
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: LND ? 'W_16x9' : 'A4_P', width: SLIDE_W, height: SLIDE_H });
    pptx.layout = LND ? 'W_16x9' : 'A4_P';
    pptx.title = 'AACAHB Weekly Epidemiological Bulletin – Week ' + M.week + '/' + M.year;

    const app = document.getElementById('app'), z0 = app.style.zoom;
    app.style.zoom = '';
    window.scrollTo(0, 0);
    resizeCharts();
    await new Promise(r => setTimeout(r, 120));
    try {
    const charts = new Map(CHARTS.map(c => [c.canvas, c]));

    for (let i = 0; i < pages.length; i++) {
      const page = pages[i];
      await new Promise(r => requestAnimationFrame(() => r()));
      const maps = new Map();
      for (const svg of page.querySelectorAll('.map-wrap svg')) {
        const b = svg.getBoundingClientRect();
        if (b.width > 0 && b.height > 0) maps.set(svg, await EXP.svgToPng(svg, b.width, b.height));
      }
      const pr = page.getBoundingClientRect();
      const ctx = { pptx, slide: pptx.addSlide(), pr, s: SLIDE_W / pr.width, maps, charts };
      ctx.slide.background = { color: 'FFFFFF' };
      Array.from(page.children).forEach(c => EXP.emit(ctx, c));
    }
    await pptx.writeFile({ fileName: `Epi_Bulletin_W${M.week}_${M.year}_${ORIENT}.pptx` });
    } finally { app.style.zoom = z0; resizeCharts(); }
  } catch (e) {
    showErr('PPT error: ' + e.message + '\n' + (e.stack || ''));
  }
}

/* ================= BOOTSTRAP: load data from Apps Script API ================= */
(function boot() {
  const ld = document.getElementById('loading'); ld.classList.add('on');
  callApi(0, 0, '', '', false, true).then(res => {
    ld.classList.remove('on');
    if (!res || !res.ok) { showErr('Server: ' + (res && res.error || 'unknown')); return; }
    D = res.data;
    try { render(); populateFilters(); } catch (e) { showErr('Render error: ' + e.message); }
  }).catch(e => { ld.classList.remove('on'); showErr('Load failed: ' + e.message); });
})();
</script>
